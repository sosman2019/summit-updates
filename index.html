<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summit Updates</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">S</span>
        <span class="brand-name">Summit Updates</span>
      </div>
      <div class="switcher">
        <select id="role-select" aria-label="Viewing as">
          <option value="ops">Ops Manager — Michael (all stores)</option>
          <option value="store">Store Manager — Rachel (Store 1)</option>
          <option value="employee">Employee</option>
        </select>
        <select id="employee-select" aria-label="Employee" hidden></select>
        <button id="reset-btn" class="btn-ghost" type="button">Reset demo data</button>
        <span id="reset-confirm" class="reset-confirm" role="alertdialog" aria-label="Confirm reset" hidden>
          <span>Reset all demo data?</span>
          <button id="reset-yes" type="button" class="btn-danger btn-sm">Reset</button>
          <button id="reset-no" type="button" class="btn-secondary btn-sm">Cancel</button>
        </span>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
